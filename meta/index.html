<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <title>Meta</title>
</head>
<body>
    <h1>Meta</h1>
    <p>Stats and visualizations about the codebase behind this website.</p>

    <div>
      <label>
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100" />
        <time id="commit-time"></time>
      </label>
    </div>

    <div id="scrolly-1">
        <div id="scatter-plot">
            <div id="stats"></div>
            <dl id="files"></dl>
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
        <div id="scatter-story"></div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>
      <dt>Date</dt>
      <dd id="commit-date"></dd>
      <dt>Time</dt>
      <dd id="commit-time-tooltip"></dd>
      <dt>Author</dt>
      <dd id="commit-author"></dd>
      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>

    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
